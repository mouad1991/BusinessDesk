<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <!-- White page -->
  <rect width="160" height="220" fill="#ffffff"/>
  <!-- Logo top-left -->
  <rect x="10" y="10" width="32" height="20" fill="#1e293b" opacity="0.85" rx="2"/>
  <!-- Center company info (gray small text) -->
  <rect x="60" y="14" width="40" height="2" fill="#94a3b8" rx="1"/>
  <rect x="60" y="19" width="36" height="2" fill="#94a3b8" rx="1"/>
  <!-- Right rounded info card (light blue) -->
  <rect x="108" y="8" width="46" height="28" fill="#e0f2fe" rx="4"/>
  <rect x="113" y="13" width="22" height="2.5" fill="#1e293b" rx="1"/>
  <rect x="138" y="13" width="14" height="2.5" fill="#1e293b" rx="1"/>
  <rect x="113" y="19" width="22" height="2.5" fill="#1e293b" rx="1"/>
  <rect x="138" y="19" width="14" height="2.5" fill="#1e293b" rx="1"/>
  <rect x="113" y="25" width="22" height="2.5" fill="#1e293b" rx="1"/>
  <rect x="138" y="25" width="14" height="2.5" fill="#1e293b" rx="1"/>
  <rect x="113" y="31" width="22" height="2.5" fill="#1e293b" rx="1"/>
  <rect x="138" y="31" width="14" height="2.5" fill="#1e293b" rx="1"/>
  <!-- "Invoice issued to" -->
  <rect x="10" y="48" width="36" height="2.5" fill="#1e293b" rx="1"/>
  <rect x="10" y="55" width="42" height="2" fill="#f59e0b" rx="1"/>
  <rect x="10" y="60" width="38" height="2" fill="#cbd5e1" rx="1"/>
  <rect x="10" y="65" width="44" height="2" fill="#cbd5e1" rx="1"/>
  <!-- AMBER table header bar -->
  <rect x="10" y="78" width="140" height="11" fill="#f59e0b"/>
  <rect x="14" y="82" width="14" height="3" fill="#ffffff" rx="1"/>
  <rect x="38" y="82" width="36" height="3" fill="#ffffff" rx="1"/>
  <rect x="92" y="82" width="14" height="3" fill="#ffffff" rx="1"/>
  <rect x="116" y="82" width="14" height="3" fill="#ffffff" rx="1"/>
  <rect x="134" y="82" width="14" height="3" fill="#ffffff" rx="1"/>
  <!-- Plain rows with thin separators (no stripes) -->
  <line x1="10" y1="98" x2="150" y2="98" stroke="#f1f5f9"/>
  <rect x="14" y="92" width="14" height="2" fill="#475569" rx="1"/>
  <rect x="38" y="92" width="34" height="2" fill="#475569" rx="1"/>
  <line x1="10" y1="108" x2="150" y2="108" stroke="#f1f5f9"/>
  <rect x="14" y="102" width="14" height="2" fill="#475569" rx="1"/>
  <rect x="38" y="102" width="40" height="2" fill="#475569" rx="1"/>
  <line x1="10" y1="118" x2="150" y2="118" stroke="#f1f5f9"/>
  <rect x="14" y="112" width="14" height="2" fill="#475569" rx="1"/>
  <rect x="38" y="112" width="32" height="2" fill="#475569" rx="1"/>
  <line x1="10" y1="128" x2="150" y2="128" stroke="#f1f5f9"/>
  <rect x="14" y="122" width="14" height="2" fill="#475569" rx="1"/>
  <rect x="38" y="122" width="38" height="2" fill="#475569" rx="1"/>
  <!-- Totals (no border, plain) -->
  <rect x="80" y="142" width="30" height="2" fill="#94a3b8" rx="1"/>
  <rect x="120" y="142" width="26" height="2" fill="#475569" rx="1"/>
  <rect x="80" y="148" width="30" height="2" fill="#94a3b8" rx="1"/>
  <rect x="120" y="148" width="26" height="2" fill="#475569" rx="1"/>
  <rect x="80" y="154" width="30" height="2" fill="#94a3b8" rx="1"/>
  <rect x="120" y="154" width="26" height="2" fill="#475569" rx="1"/>
  <!-- Amber highlighted balance -->
  <rect x="76" y="160" width="74" height="10" fill="#f59e0b"/>
  <rect x="80" y="164" width="30" height="2.5" fill="#ffffff" rx="1"/>
  <rect x="120" y="164" width="26" height="2.5" fill="#ffffff" rx="1"/>
  <!-- Empty footer area -->
  <line x1="10" y1="208" x2="150" y2="208" stroke="#e2e8f0"/>
  <rect x="40" y="212" width="80" height="2" fill="#cbd5e1" rx="1"/>
</svg>
