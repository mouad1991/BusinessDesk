  <rect x="8" y="42" width="30" height="3" fill="#0ea5e9" rx="1"/>
  <rect x="86" y="42" width="30" height="3" fill="#0ea5e9" rx="1"/>
  <!-- Info lines left -->
  <rect x="8" y="49" width="60" height="2" fill="#e2e8f0" rx="1"/>
