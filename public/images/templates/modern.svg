  <rect x="86" y="54" width="50" height="2" fill="#e2e8f0" rx="1"/>
  <rect x="86" y="59" width="55" height="2" fill="#e2e8f0" rx="1"/>
  <!-- Table header -->
  <rect x="8" y="68" width="144" height="10" fill="#0c4a6e" rx="1"/>
