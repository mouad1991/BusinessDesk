<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Dark navy background -->
  <rect width="40" height="40" rx="9" fill="#1a3a5c"/>

  <!-- Stacked document shadows -->
  <rect x="6" y="12" width="18" height="22" rx="3" fill="white" opacity="0.12"/>
  <rect x="9" y="9" width="18" height="22" rx="3" fill="white" opacity="0.22"/>

  <!-- Main front document -->
  <rect x="12" y="6" width="18" height="22" rx="3" fill="white"/>

  <!-- Folded corner -->
  <path d="M24 6 L30 6 L30 12 L24 6Z" fill="#d6e4f4"/>
  <path d="M24 6 L24 12 L30 12" stroke="#b8cfe6" stroke-width="0.8" fill="none"/>

  <!-- Text lines simulating content -->
  <rect x="15" y="10" width="7" height="1.4" rx="0.7" fill="#1a3a5c" opacity="0.25"/>
  <rect x="15" y="13" width="10" height="1.4" rx="0.7" fill="#1a3a5c" opacity="0.15"/>

  <!-- Rising trend line chart -->
  <polyline points="15,24 18,20 21,22 26,16"
            stroke="#1a73c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="15" cy="24" r="1.6" fill="#1a73c8"/>
  <circle cx="18" cy="20" r="1.4" fill="#1a73c8" opacity="0.7"/>
  <circle cx="21" cy="22" r="1.4" fill="#1a73c8" opacity="0.7"/>
  <circle cx="26" cy="16" r="1.8" fill="#1a73c8"/>

  <!-- Bottom accent bar -->
  <rect x="6" y="36" width="28" height="3" rx="1.5" fill="#1a73c8"/>
</svg>
